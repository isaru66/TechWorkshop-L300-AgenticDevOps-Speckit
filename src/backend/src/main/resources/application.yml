server:
  port: 8080
  address: 127.0.0.1

spring:
  application:
    name: local-banking-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: local-banking-mcp
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        instructions: >
          Local demo banking MCP server (no authentication). Manage customers and accounts,
          deposit, withdraw, transfer funds (THB), and read transaction history.
        streamable-http:
          mcp-endpoint: /mcp

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

banking:
  seed:
    path: ../data/seed
